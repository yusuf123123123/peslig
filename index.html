<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1330">
<title>PES Ligi</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1330;--s1:#181d45;--s2:#222959;--line:#ffffff14;--tx:#eef0ff;--mu:#8f97c4;--gold:#ffc857;--acc:#5b8cff;--win:#4cd49a;--lose:#ff6b7a;--tab:64px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 Barlow,system-ui,sans-serif;overflow:hidden}
.pages{position:fixed;inset:0 0 calc(var(--tab) + env(safe-area-inset-bottom)) 0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;padding:calc(env(safe-area-inset-top) + 14px) 14px 28px}
.page>div{max-width:560px;margin:0 auto}
header{max-width:560px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
h1{font:800 34px/1 'Barlow Condensed',sans-serif;margin:0;letter-spacing:.01em}
button{font:inherit;color:inherit}
#gbm{font:700 17px 'Barlow Condensed',sans-serif;letter-spacing:.08em;background:var(--s2);border:1.5px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer}
#gbm[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;flex:none}
/* puan durumu */
table{width:100%;border-collapse:separate;border-spacing:0 6px}
th{font-weight:600;font-size:13px;color:var(--mu);padding:0 4px 2px;text-align:center}
td{background:var(--s1);padding:13px 4px;text-align:center;font-size:17px}
td:first-child{border-radius:12px 0 0 12px;width:38px;font:800 20px 'Barlow Condensed',sans-serif;color:var(--mu)}
td:last-child{border-radius:0 12px 12px 0}
tr:first-child td:first-child{color:var(--gold)}
th:nth-child(2),td:nth-child(2){text-align:left}
td:nth-child(2){font:800 23px 'Barlow Condensed',sans-serif;white-space:nowrap}
td.p{font:800 25px 'Barlow Condensed',sans-serif;color:var(--gold);width:46px}
.x{display:none}body.gbm .x{display:table-cell}
/* fikstür */
.day{margin-bottom:18px}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px}
.dh b{font:800 22px 'Barlow Condensed',sans-serif}
.dh span{color:var(--mu);font-size:14px}
.today .dh b::after{content:"Bugün";font:600 12px Barlow,sans-serif;background:var(--gold);color:#1a1a2e;border-radius:999px;padding:2px 9px;margin-left:10px;vertical-align:3px}
.m{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--s1);border-radius:14px;padding:12px;margin-bottom:8px}
.m .t{font:800 21px 'Barlow Condensed',sans-serif;display:flex;align-items:center;min-width:0}
.m .t:last-child{justify-content:flex-end}
.sc{background:#090c22;color:var(--gold);font:800 26px 'Barlow Condensed',sans-serif;letter-spacing:.08em;padding:3px 14px;border-radius:9px;min-width:78px;text-align:center}
.sc.no{color:#ffc85755}
/* takımlar */
.tc{background:var(--s1);border-radius:18px;padding:16px;margin-bottom:12px;border-left:6px solid var(--c)}
.tt{display:flex;justify-content:space-between;align-items:center}
.tn{font:800 34px/1 'Barlow Condensed',sans-serif}
.tn small{font:700 16px Barlow,sans-serif;color:var(--mu);margin-left:8px}
.tp{font:800 38px/1 'Barlow Condensed',sans-serif;color:var(--gold);text-align:right}
.tp small{display:block;font:600 12px Barlow,sans-serif;color:var(--mu)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 10px}
.g4 div{background:var(--s2);border-radius:10px;padding:8px 4px;text-align:center;font:800 24px/1.1 'Barlow Condensed',sans-serif}
.g4 small{display:block;font:600 12px Barlow,sans-serif;color:var(--mu)}
.fm{display:flex;gap:5px;align-items:center;margin-bottom:8px;min-height:24px;color:var(--mu);font-size:14px}
.fm i{font:800 14px 'Barlow Condensed',sans-serif;font-style:normal;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#10132b}
.fm .G{background:var(--win)}.fm .B{background:#aab0d6}.fm .M{background:var(--lose)}
.nx{color:var(--mu);font-size:14px}.nx b{color:var(--tx);font-weight:600}
/* rekorlar */
.rc{background:var(--s1);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px}
.rl{color:var(--mu);font-size:14px}
.rv{grid-row:1/3;grid-column:2;font:800 40px/1 'Barlow Condensed',sans-serif;color:var(--gold)}
.rd{font:800 24px 'Barlow Condensed',sans-serif}
.gk{background:var(--s1);border-radius:18px;padding:16px;margin-bottom:12px;border:1.5px solid #ffc85766}
.gkt{display:flex;align-items:center;gap:8px;font:800 28px 'Barlow Condensed',sans-serif;color:var(--gold);margin-bottom:6px}
.gkt svg{width:24px;height:24px;fill:var(--gold)}
.gr{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;margin:12px 0 0}
.gr>b{font:800 22px 'Barlow Condensed',sans-serif;color:var(--mu)}
.gr:nth-of-type(1)>b{color:var(--gold)}
.gn{font:800 22px 'Barlow Condensed',sans-serif;display:flex;align-items:center}
.bar{height:6px;border-radius:3px;background:var(--s2);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;min-width:3px}
.gn small{font:600 13px Barlow,sans-serif;color:var(--mu);margin-left:8px}
.nogk{color:var(--mu);margin:8px 0 0;font-size:14px}
.gv{font:800 32px/1 'Barlow Condensed',sans-serif;text-align:right}
.gv small{display:block;font:600 12px Barlow,sans-serif;color:var(--mu)}
.empty{color:var(--mu);text-align:center;padding:40px 10px}
/* alt menü */
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:#0a0d24;border-top:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;color:#6f77a3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;cursor:pointer;position:relative;padding:0 2px;white-space:nowrap}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs .on{color:#fff}
.tabs .on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
#note{position:fixed;left:12px;right:12px;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 10px);background:var(--s2);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:14px;z-index:5}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media(max-width:360px){td:nth-child(2){font-size:20px}h1{font-size:30px}}
</style>
</head>
<body>
<div class="pages" id="pages">
 <section class="page"><header><h1>Takım bilgileri</h1></header><div id="teams"></div></section>
 <section class="page" id="pf"><header><h1>Fikstür</h1></header><div id="fix"></div></section>
 <section class="page"><header><h1>Puan durumu</h1><button id="gbm" aria-pressed="false" aria-label="Galibiyet, beraberlik, mağlubiyet sütunlarını göster">G B M</button></header><div id="table"></div></section>
 <section class="page"><header><h1>Gol krallığı</h1></header><div id="gkp"></div></section>
 <section class="page"><header><h1>Rekorlar</h1></header><div id="rec"></div></section>
</div>
<p id="note" hidden></p>
<nav class="tabs" id="tabs">
 <button><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4.5 2 4.5 4.5"/></svg>Takımlar</button>
 <button><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Fikstür</button>
 <button><svg viewBox="0 0 24 24"><path d="M5 20v-9M12 20V4M19 20v-6"/></svg>Puan durumu</button>
 <button><svg viewBox="0 0 24 24"><path d="M3 18h18l-1.5-10-4.5 4-3-7-3 7-4.5-4z"/></svg>Gol Krallığı</button>
 <button><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H4.5c0 3 1.5 4.5 3.5 4.5M16 6h3.5c0 3-1.5 4.5-3.5 4.5M12 13v4M8.5 20h7"/></svg>Rekorlar</button>
</nav>
<script>
// Google Sheets > Dosya > Paylaş > Web'de yayınla > CSV linkini buraya yapıştır:
const SHEET_CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vR3oE4xcWzLYqIZJ6TbJIqCs4Q-0cls2gQAPrdjVcD8RGNfhYYVMu4IrYN4q9V_qVd6j5Bl1ZsTUrmP/pub?gid=2074515296&single=true&output=csv";

const N={E:'Emir',H:'Halil',Y:'Yusuf',A:'Aras'};
const COL={Yusuf:'#4da3ff',Halil:'#ff7a7a',Emir:'#ffc857',Aras:'#5fd6a4'};
const TEAMS=Object.values(N);
const MATCHES=[];
"EH,YA|EY,HA|EA,HY|HE,AY|YE,AH|AE,YH|EH,YA|EY,HA|EA,HY|HE,AY|YE,AH|AE,YH".split('|').forEach((d,i)=>d.split(',').forEach(m=>MATCHES.push({d:i+1,h:N[m[0]],a:N[m[1]],s:null})));
const dateOf=d=>new Date(2026,10,13+d-1);
const fmt=d=>d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'});
const $=id=>document.getElementById(id),low=s=>fold(s||'');
const dot=n=>`<i class="dot" style="background:${COL[n]}"></i>`;

function stats(){
 const t={};TEAMS.forEach(n=>t[n]={n,o:0,g:0,b:0,m:0,gf:0,ga:0,form:[],run:0,best:0});
 MATCHES.forEach(m=>{if(!m.s)return;const[x,y]=m.s;
  [[m.h,x,y],[m.a,y,x]].forEach(([n,f,a])=>{const s=t[n];s.o++;s.gf+=f;s.ga+=a;
   const r=f>a?'G':f<a?'M':'B';s[r.toLowerCase()]++;s.form.push(r);
   if(r==='G'){s.run++;s.best=Math.max(s.best,s.run)}else s.run=0;});});
 return Object.values(t).map(s=>({...s,av:s.gf-s.ga,p:s.g*3+s.b}))
  .sort((a,b)=>b.p-a.p||b.av-a.av||b.gf-a.gf||a.n.localeCompare(b.n,'tr'));
}
function drawTable(st){
 $('table').innerHTML=`<table><thead><tr><th></th><th>Takım</th><th>O</th><th class="x">G</th><th class="x">B</th><th class="x">M</th><th>AV</th><th>P</th></tr></thead><tbody>`+
 st.map((x,i)=>`<tr><td>${i+1}</td><td>${dot(x.n)}${x.n}</td><td>${x.o}</td><td class="x">${x.g}</td><td class="x">${x.b}</td><td class="x">${x.m}</td><td>${x.av>0?'+':''}${x.av}</td><td class="p">${x.p}</td></tr>`).join('')+'</tbody></table>';
}
function drawTeams(st){
 $('teams').innerHTML=st.map((x,i)=>{
  const nx=MATCHES.find(m=>!m.s&&(m.h===x.n||m.a===x.n));
  return `<div class="tc" style="--c:${COL[x.n]}"><div class="tt"><div class="tn">${x.n}<small>${i+1}. sırada</small></div><div class="tp">${x.p}<small>puan</small></div></div>
  <div class="g4"><div>${x.o}<small>Maç</small></div><div>${x.g}<small>Galibiyet</small></div><div>${x.b}<small>Beraberlik</small></div><div>${x.m}<small>Mağlubiyet</small></div></div>
  <div class="fm">${x.form.length?x.form.slice(-5).map(r=>`<i class="${r}">${r}</i>`).join(''):'Henüz maç yok'}</div>
  <div class="nx">Attığı ${x.gf}, yediği ${x.ga} gol${nx?` &nbsp;|&nbsp; Sıradaki: <b>${nx.h===x.n?nx.a:nx.h}</b>, ${fmt(dateOf(nx.d))}`:''}</div></div>`}).join('');
}
function drawFix(){
 const today=new Date().toDateString();let h='';
 for(let d=1;d<=12;d++){const dt=dateOf(d);
  h+=`<section class="day${dt.toDateString()===today?' today':''}"><div class="dh"><b>${d}. Gün</b><span>${fmt(dt)}</span></div>`+
  MATCHES.filter(m=>m.d===d).map(m=>`<div class="m"><span class="t">${dot(m.h)}${m.h}</span><span class="sc${m.s?'':' no'}">${m.s?m.s[0]+' - '+m.s[1]:'- : -'}</span><span class="t">${m.a}${dot(m.a).replace('margin-right:8px','')}</span></div>`).join('')+'</section>';}
 $('fix').innerHTML=h;
}
function drawRec(st){
 const pl=MATCHES.filter(m=>m.s);
 const ks=scorers().slice(0,10),mg=Math.max(1,ks.length?ks[0].g:1);
 const gk='<div class="gk"><div class="gkt"><svg viewBox="0 0 24 24"><path d="M3 18h18l-1.5-10-4.5 4-3-7-3 7-4.5-4z"/></svg>En çok gol atanlar</div>'+(ks.length?ks.map((x,i)=>`<div class="gr"><b>${i+1}</b><div><div class="gn">${dot(x.team)}${x.name}<small>${x.team}</small></div><div class="bar"><i style="width:${x.g/mg*100}%;background:${COL[x.team]}"></i></div></div><div class="gv">${x.g}<small>${x.mt.size} maçta</small></div></div>`).join(''):'<p class="nogk">Golü atan futbolcular henüz girilmedi. Sheets\'te F ve G sütunlarına yaz.</p>')+'</div>';
 $('gkp').innerHTML=gk;
 if(!pl.length){$('rec').innerHTML='<p class="empty">İlk maç oynanınca rekorlar burada görünecek.</p>';return;}
 const mx=(arr,f)=>arr.reduce((a,b)=>f(b)>f(a)?b:a);
 const ga=mx(st.filter(s=>s.o),s=>-s.ga),bs=mx(st,s=>s.best);
 const big=mx(pl,m=>Math.abs(m.s[0]-m.s[1])),top=mx(pl,m=>m.s[0]+m.s[1]);
 const mt=m=>`${m.h} - ${m.a}`;
 const c=(l,v,d)=>`<div class="rc"><span class="rl">${l}</span><span class="rv">${v}</span><span class="rd">${d}</span></div>`;
 $('rec').innerHTML=c('En az gol yiyen',ga.ga,ga.n)+
  c('En büyük fark',big.s[0]+'-'+big.s[1],mt(big))+c('En gollü maç',top.s[0]+'-'+top.s[1],mt(top))+
  c('En uzun galibiyet serisi',bs.best,bs.best?bs.n:'Henüz yok');
}
let first=true;
function draw(){const st=stats();drawTable(st);drawTeams(st);drawFix();drawRec(st);
 if(first){first=false;const t=document.querySelector('.today');if(t)$('pf').scrollTop=t.offsetTop-70;}}

function csv(t){const rows=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;
  else if(ch==','){r.push(c);c=''}
  else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}
  else c+=ch}
 r.push(c);rows.push(r);return rows.map(r=>r.map(x=>x.trim()));}
// Büyük/küçük harf ve Türkçe karakter farkı yok sayılır (Kökçü = kokcu = KÖKÇÜ)
function fold(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i').replace(/\s+/g,' ').trim();}
const mixed=s=>/[a-zçğıöşü]/.test(s)&&/[A-ZÇĞİÖŞÜ]/.test(s);
const title=s=>s.trim().split(/\s+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');
const disp=ns=>{const b=ns.slice().sort((a,c)=>fold(c).length-fold(a).length||(mixed(c)?1:0)-(mixed(a)?1:0))[0];return mixed(b)?b:title(b);};
// "Messi 2, James Rodriguez, Neymar x3" -> ad soyad ve gol sayısı otomatik ayrılır
function scorers(){
 const raw=[];
 MATCHES.forEach(m=>{if(!m.s||!m.g)return;
  [[m.g[0],m.h],[m.g[1],m.a]].forEach(([txt,team])=>txt.split(/[,;\/]/).forEach(tok=>{
   tok=tok.trim();if(!tok)return;
   const mm=tok.match(/^(.*?)\s*(?:[x×(]\s*)?(\d+)\)?$/i),name=(mm?mm[1]:tok).trim(),n=mm?+mm[2]:1;
   if(name&&n)raw.push({name,f:fold(name),team,n,k:m.d+team});}));});
 // tek kelimelik isim (Yamal) tek bir tam adla (Lamine Yamal) eşleşiyorsa aynı kişi sayılır
 const full=[...new Set(raw.map(r=>r.f).filter(f=>f.includes(' ')))];
 const canon=f=>{if(f.includes(' '))return f;const c=full.filter(x=>x.split(' ').includes(f));return c.length===1?c[0]:f;};
 const t={};
 raw.forEach(r=>{const k=canon(r.f)+'|'+r.team,o=t[k]||(t[k]={team:r.team,g:0,mt:new Set(),ns:[]});
  o.g+=r.n;o.mt.add(r.k);o.ns.push(r.name);});
 return Object.values(t).map(o=>({name:disp(o.ns),team:o.team,g:o.g,mt:o.mt.size}))
  .sort((a,b)=>b.g-a.g||a.name.localeCompare(b.name,'tr'));
}
async function fetchCsv(){
 const u=SHEET_CSV_URL;let err='ağ hatası';
 for(const url of [u,u+(u.includes('?')?'&':'?')+'t='+Date.now()]){
  try{const r=await fetch(url,{cache:'no-store'});if(r.ok)return await r.text();err='HTTP '+r.status;}
  catch(e){err='bağlantı engellendi: '+location.protocol}
 }
 throw new Error(err);
}
async function load(){
 const note=$('note');
 if(!SHEET_CSV_URL){note.textContent='Skorlar bağlı değil: index.html içine Google Sheets linkini ekle.';note.hidden=false;return draw();}
 try{
  const map={},gm={};
  csv(await fetchCsv()).forEach(c=>{
   if(!/^\d+$/.test(c[0])||!c[3]||!c[4]||isNaN(c[3])||isNaN(c[4]))return;
   const k=c[0]+'|'+low(c[1])+'|'+low(c[2]);map[k]=[+c[3],+c[4]];gm[k]=[c[5]||'',c[6]||''];});
  MATCHES.forEach(m=>{const k=m.d+'|'+low(m.h)+'|'+low(m.a);m.s=map[k]||null;m.g=gm[k]||null;});
  note.hidden=true;
 }catch(e){note.textContent='Skorlar yüklenemedi ('+(e.message||'bilinmeyen hata')+').';note.hidden=false;}
 draw();
}

const P=$('pages'),tabs=[...document.querySelectorAll('#tabs button')];
const go=(i,sm)=>P.scrollTo({left:i*P.clientWidth,behavior:sm?'smooth':'auto'});
const mark=()=>{const i=Math.round(P.scrollLeft/P.clientWidth);tabs.forEach((b,j)=>b.classList.toggle('on',j===i));};
tabs.forEach((b,i)=>b.onclick=()=>go(i,true));
P.addEventListener('scroll',mark,{passive:true});
$('gbm').onclick=e=>{const on=document.body.classList.toggle('gbm');e.currentTarget.setAttribute('aria-pressed',on)};
let tx=0,ty=0,ti=0;
P.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;ti=Math.round(P.scrollLeft/P.clientWidth)},{passive:true});
P.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
 if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(Math.max(0,Math.min(tabs.length-1,ti+(dx<0?1:-1))),true)},{passive:true});
addEventListener('resize',()=>go(Math.round(P.scrollLeft/P.clientWidth)));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
draw();go(2);mark();load();
</script>
</body>
</html>
